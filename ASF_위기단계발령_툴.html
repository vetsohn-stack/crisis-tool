<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ASF 위기단계 발령 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;background:#f5f5f3;padding:1.5rem;}
.wrap{max-width:780px;margin:0 auto;background:#fff;border-radius:12px;padding:1.5rem;border:0.5px solid #ddd;}
h1{font-size:17px;font-weight:600;margin-bottom:3px;}
.sub{font-size:13px;color:#666;margin-bottom:1.25rem;}
.type-row{display:flex;gap:6px;margin-bottom:10px;align-items:center;}
.lbl{font-size:13px;color:#666;}
.tbtn{padding:6px 14px;font-size:13px;border:0.5px solid #ccc;border-radius:20px;cursor:pointer;background:none;color:#555;}
.tbtn.a{background:#FCEBEB;border-color:#E24B4A;color:#791F1F;font-weight:500;}
.tbtn.w{background:#FAEEDA;border-color:#BA7517;color:#633806;font-weight:500;}
.date-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
input.di{padding:6px 10px;font-size:13px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;}
.add-btn{padding:6px 14px;font-size:13px;border:0.5px solid #ccc;border-radius:8px;cursor:pointer;background:none;color:#1a1a1a;white-space:nowrap;}
.add-btn:hover{background:#f5f5f3;}
.sido-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px;}
.sdbt{padding:3px 9px;font-size:12px;border:0.5px solid #ddd;border-radius:20px;cursor:pointer;background:none;color:#666;}
.sdbt.on{background:#f0f0ee;color:#1a1a1a;border-color:#aaa;font-weight:500;}
input.srch{width:100%;padding:7px 11px;font-size:13px;border:0.5px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;margin-bottom:7px;}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:3px;max-height:180px;overflow-y:auto;border:0.5px solid #ddd;border-radius:8px;padding:7px;}
.sg{padding:5px 7px;font-size:12px;border:0.5px solid #ddd;border-radius:5px;cursor:pointer;background:none;color:#555;text-align:left;}
.sg:hover{background:#f5f5f3;}
.sg.sa{background:#FCEBEB;border-color:#E24B4A;color:#791F1F;font-weight:500;}
.sg.sw{background:#FAEEDA;border-color:#BA7517;color:#633806;font-weight:500;}
.div{height:0.5px;background:#e8e8e8;margin:1rem 0;}
.row2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.clr{padding:3px 9px;font-size:12px;border:0.5px solid #ddd;border-radius:20px;cursor:pointer;background:none;color:#666;}
.sec-lbl{font-size:11px;color:#888;margin-bottom:5px;}
.rec-list{display:flex;flex-direction:column;gap:4px;}
.rec{display:flex;align-items:center;gap:8px;padding:5px 8px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:12px;flex-wrap:wrap;}
.rec.expired{opacity:0.45;}
.rec-name{font-weight:600;min-width:70px;}
.rec-name.ra{color:#791F1F;}
.rec-name.rw{color:#633806;}
.rec-name.rj{color:#185FA5;}
.rec-date{color:#666;flex:1;min-width:180px;}
.rec-badge{padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;}
.rec-badge.va{background:#FCEBEB;color:#791F1F;}
.rec-badge.vw{background:#FAEEDA;color:#633806;}
.rec-badge.exp{background:#f0f0ee;color:#aaa;}
.rec-del{padding:1px 6px;font-size:11px;border:0.5px solid #ddd;border-radius:4px;cursor:pointer;background:none;color:#aaa;margin-left:auto;}
.rec-del:hover{color:#555;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem;}
.sc{background:#f5f5f3;border-radius:8px;padding:10px 14px;}
.sl{font-size:11px;color:#888;margin-bottom:3px;}
.sn{font-size:20px;font-weight:600;}
.sn.r{color:#A32D2D;}.sn.am{color:#854F0B;}.sn.b{color:#185FA5;}
.rtable{width:100%;font-size:13px;border-collapse:collapse;}
.rtable th{padding:7px 6px;text-align:left;font-weight:500;color:#888;font-size:11px;border-bottom:0.5px solid #ccc;}
.rtable td{padding:6px 6px;border-bottom:0.5px solid #eee;}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:500;}
.tag.a{background:#FCEBEB;color:#791F1F;}
.tag.w{background:#FAEEDA;color:#633806;}
.tag.j{background:#E6F1FB;color:#185FA5;}
.xbtn{padding:6px 14px;font-size:13px;border:0.5px solid #ccc;border-radius:8px;cursor:pointer;background:none;color:#1a1a1a;}
.xbtn:hover{background:#f5f5f3;}
.empty{color:#aaa;font-size:13px;font-style:italic;}
.hint{font-size:12px;color:#aaa;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
<h1>ASF 위기단계 발령 관리</h1>
<p class="sub">발생시군·일자 입력 → 유효기간 자동 관리 → 위기단계 발령 목록</p>

<div class="type-row">
  <span class="lbl">입력 유형</span>
  <button class="tbtn a" id="ba" onclick="setType('asf')">ASF 발생 (유효 3년)</button>
  <button class="tbtn" id="bw" onclick="setType('wild')">야생멧돼지 발생 (유효 30일)</button>
</div>

<div class="date-row">
  <label style="font-size:13px;color:#666;">발생일자</label>
  <input class="di" type="date" id="dateinput"/>
  <button class="add-btn" onclick="addSelected()">선택 시군 추가 ↗</button>
</div>

<div class="sido-row" id="sdrow"></div>
<input class="srch" type="text" placeholder="시군 검색..." oninput="doSearch(this.value)" id="si"/>
<div class="sgrid" id="sgrid"></div>
<div class="hint" id="sel-hint">시군을 클릭하여 선택 후 날짜를 지정하고 추가하세요.</div>

<div class="div"></div>

<div class="row2">
  <span style="font-size:13px;font-weight:600;">발생 기록</span>
  <button class="clr" onclick="clearAll()">전체 초기화</button>
</div>
<div class="sec-lbl">ASF 발생시군 <span style="color:#ccc">(유효기간 3년)</span></div>
<div class="rec-list" id="rl-a" style="margin-bottom:10px;"><span class="empty">없음</span></div>
<div class="sec-lbl">야생멧돼지 발생시군 <span style="color:#ccc">(유효기간 30일)</span></div>
<div class="rec-list" id="rl-w"><span class="empty">없음</span></div>

<div class="div"></div>

<div class="stats">
  <div class="sc"><div class="sl">ASF 발생시군 (3년)</div><div class="sn r" id="n-a">0</div></div>
  <div class="sc"><div class="sl">야생멧돼지 발생시군 (30일)</div><div class="sn am" id="n-w">0</div></div>
  <div class="sc"><div class="sl">위기단계 발령 총계</div><div class="sn b" id="n-t">0</div></div>
</div>

<div class="row2">
  <span style="font-size:13px;font-weight:600;">위기단계 발령 시군 목록</span>
  <button class="xbtn" onclick="exportCSV()">CSV 내보내기</button>
</div>
<div id="rlist"></div>
</div>

const TODAY=new Date();TODAY.setHours(0,0,0,0);
function toDate(s){const d=new Date(s);d.setHours(0,0,0,0);return d;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function addYears(d,n){const r=new Date(d);r.setFullYear(r.getFullYear()+n);return r;}
function fmt(d){return d.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'});}
function daysLeft(exp){return Math.ceil((exp-TODAY)/86400000);}

let records=[],rid=0,type='asf',sido='전체',pending=new Set();
document.getElementById('dateinput').value=TODAY.toISOString().slice(0,10);

function setType(t){
  type=t;
  document.getElementById('ba').className='tbtn'+(t==='asf'?' a':'');
  document.getElementById('bw').className='tbtn'+(t==='wild'?' w':'');
  pending.clear();renderGrid();
}

function allSigun(){
  const all=[];
  Object.values(BY_SIDO).forEach(l=>l.forEach(s=>{if(!all.includes(s))all.push(s);}));
  return all.sort((a,b)=>a.localeCompare(b,'ko'));
}

function buildSido(){
  const el=document.getElementById('sdrow');
  const sidos=['전체',...Object.keys(BY_SIDO)];
  el.innerHTML=sidos.map(s=>`<button class="sdbt${s===sido?' on':''}" onclick="setSido('${s}')">${s}</button>`).join('');
}

function setSido(s){sido=s;document.getElementById('si').value='';buildSido();renderGrid();}
function doSearch(q){sido='전체';buildSido();renderGrid(q);}

function getActiveSet(t){
  return new Set(records.filter(r=>r.type===t&&r.expDate>=TODAY).map(r=>r.name));
}

function renderGrid(q){
  const qv=(q!==undefined?q:(document.getElementById('si').value||'')).trim();
  let list=sido==='전체'?allSigun():(BY_SIDO[sido]||[]);
  if(qv)list=allSigun().filter(s=>s.includes(qv));
  const aA=getActiveSet('asf'),aW=getActiveSet('wild');
  document.getElementById('sgrid').innerHTML=list.map(sg=>{
    let c='sg';
    if(pending.has(sg))c+=(type==='asf'?' sa':' sw');
    else if(aA.has(sg))c+=' sa';
    else if(aW.has(sg))c+=' sw';
    return `<button class="${c}" onclick="togP('${sg}')">${sg}</button>`;
  }).join('');
  const n=pending.size;
  document.getElementById('sel-hint').textContent=n>0
    ?`${n}개 시군 선택됨 — 날짜 확인 후 [선택 시군 추가]를 클릭하세요.`
    :'시군을 클릭하여 선택 후 날짜를 지정하고 추가하세요.';
}

function togP(sg){
  if(pending.has(sg))pending.delete(sg);else pending.add(sg);
  renderGrid();
}

function addSelected(){
  const dv=document.getElementById('dateinput').value;
  if(!dv){alert('발생일자를 입력해 주세요.');return;}
  if(pending.size===0){alert('시군을 먼저 선택해 주세요.');return;}
  const occ=toDate(dv);
  if(occ>TODAY){alert('발생일자는 오늘 이전이어야 합니다.');return;}
  const exp=type==='asf'?addYears(occ,3):addDays(occ,30);
  pending.forEach(name=>{
    // 기존 같은 시군 기록 제거 (연결된 인접시군도 함께)
    const old=records.find(r=>r.name===name&&r.type===type&&!r.parentId);
    if(old) records=records.filter(r=>r.id!==old.id&&r.parentId!==old.id);
    const newId=rid++;
    records.push({id:newId,name,type,occDate:occ,expDate:exp,parentId:null});
    // 야생멧돼지 → 인접시군 자동 등록
    if(type==='wild'){
      (ADJ[name]||[]).forEach(adj=>{
        const alreadySrc=records.find(r=>r.name===adj&&r.type==='wild'&&!r.parentId);
        if(!alreadySrc){
          // 기존 인접 기록 덮어쓰기
          records=records.filter(r=>!(r.name===adj&&r.type==='wild'&&r.parentId));
          records.push({id:rid++,name:adj,type:'wild',occDate:occ,expDate:exp,parentId:newId,isAdj:true});
        }
      });
    }
  });
  pending.clear();
  renderGrid();renderRecords();updateResult();
}

function delRecord(id){
  // 발생시군 삭제 시 연결된 인접시군도 함께 삭제
  records=records.filter(r=>r.id!==id&&r.parentId!==id);
  renderRecords();updateResult();renderGrid();
}

function clearAll(){
  records=[];pending.clear();
  renderGrid();renderRecords();updateResult();
}

function renderRecords(){
  function makeList(t,elId){
    const recs=records.filter(r=>r.type===t).sort((a,b)=>{
      // 발생시군 먼저, 인접시군 나중에; 같은 그룹은 날짜 역순
      if(!a.parentId&&b.parentId)return -1;
      if(a.parentId&&!b.parentId)return 1;
      return b.occDate-a.occDate;
    });
    const el=document.getElementById(elId);
    if(!recs.length){el.innerHTML='<span class="empty">없음</span>';return;}
    const vc=t==='asf'?'va':'vw';
    el.innerHTML=recs.map(r=>{
      const valid=r.expDate>=TODAY;
      const dl=daysLeft(r.expDate);
      const badge=valid?`만료까지 ${dl}일`:'만료됨';
      const nc=r.isAdj?'rj':(t==='asf'?'ra':'rw');
      const adjLabel=r.isAdj?` <span style="font-size:10px;color:#888;font-weight:400">(인접자동)</span>`:'';
      const delBtn=r.isAdj?'':`<button class="rec-del" onclick="delRecord(${r.id})">삭제</button>`;
      return `<div class="rec${valid?'':' expired'}">
        <span class="rec-name ${nc}">${r.name}${adjLabel}</span>
        <span class="rec-date">발생 ${fmt(r.occDate)} → 만료 ${fmt(r.expDate)}</span>
        <span class="rec-badge ${valid?vc:'exp'}">${badge}</span>
        ${delBtn}
      </div>`;
    }).join('');
  }
  makeList('asf','rl-a');
  makeList('wild','rl-w');
}

function getAdj(set){
  const r=new Set();
  set.forEach(s=>(ADJ[s]||[]).forEach(n=>{if(!set.has(n))r.add(n);}));
  return r;
}

// 시군명 단축 (접미사 제거, 단 광역시구는 "광역시명+구명"에서 구명만)
function shortName(name){
  // 광역시구: "울산북구" → "북구", "부산해운대구" → "해운대구"
  const metros=['서울','부산','대구','인천','광주','대전','울산'];
  for(const m of metros){
    if(name.startsWith(m) && name.endsWith('구')){
      return name.slice(m.length); // "북구","해운대구" 등
    }
  }
  // 일반 시군구 접미사 제거
  return name.replace(/(특별자치시|특별자치도|광역시|특별시|시|군|구)$/, '');
}

// 시군 배열을 도별로 그룹화 → "(도) 시군·시군" 형식 문자열
function groupBySido(arr){
  const map={};
  arr.forEach(sg=>{
    const sido=SIDO_MAP[sg]||'기타';
    if(!map[sido])map[sido]=[];
    map[sido].push(shortName(sg));
  });
  // 도 순서: 경기→강원→충북→충남→전북→전남→경북→경남→제주→서울→부산→대구→인천→광주→대전→울산→세종
  const ORDER=['경기','강원','충북','충남','전북','전남','경북','경남','제주','서울','부산','대구','인천','광주','대전','울산','세종','기타'];
  const parts=[];
  ORDER.forEach(sido=>{
    if(map[sido]&&map[sido].length){
      parts.push(`(${sido}) ${map[sido].join('·')}`);
    }
  });
  return parts.join(' ');
}

function updateResult(){
  const aA=getActiveSet('asf'),aW=getActiveSet('wild');
  // ★ ASF 발생시군은 인접 미포함, 야생멧돼지만 인접 포함
  const adjW=getAdj(aW);
  const allSrc=new Set([...aA,...aW]);
  const adjAll=new Set();
  [...adjW].forEach(s=>{if(!allSrc.has(s))adjAll.add(s);});
  const total=new Set([...allSrc,...adjAll]);

  document.getElementById('n-a').textContent=aA.size;
  document.getElementById('n-w').textContent=aW.size;
  document.getElementById('n-t').textContent=total.size;

  // ── 요약 텍스트 형식 출력 ──
  const el=document.getElementById('rlist');
  if(!allSrc.size&&!adjAll.size){
    el.innerHTML='<div class="empty" style="padding:8px 0;">유효한 발생시군을 등록하면 결과가 표시됩니다.</div>';
    window._rows=[];return;

  const today=new Date();
  const dateStr=`${today.getMonth()+1}.${today.getDate()}`;

  // 각 그룹 정렬
  const aAarr=[...aA].sort((a,b)=>a.localeCompare(b,'ko'));

function exportCSV(){
  if(!window._rows||!window._rows.length){alert('결과가 없습니다.');return;}
  const csv='\uFEFF시군,구분,발령근거,발생일\n'+window._rows.map(r=>`${r.name},${r.type},${r.reason},${r.detail}`).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download='ASF_위기단계발령_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}
